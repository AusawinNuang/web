
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ausawin Channel 2026</title>
    <!-- ใช้ Video.js สำหรับเล่นสตรีมมิ่งสด -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <script src="https://zencdn.net"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            gap: 20px;
        }
        /* เมนูด้านข้างแสดงรายการช่อง */
        .sidebar {
            width: 320px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }
        .upload-section {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .upload-section input {
            width: 100%;
            margin-top: 5px;
            color: #fff;
        }
        .channel-list {
            flex-grow: 1;
            overflow-y: auto; /* เลื่อนขึ้นลงได้หากช่องเยอะ */
            margin-top: 10px;
        }
        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px;
            background: #252525;
            border: 1px solid #333;
            color: white;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: 0.2s;
        }
        .channel-item:hover {
            background: #333;
            border-color: #007aff;
        }
        .channel-item img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            background: #fff;
            border-radius: 4px;
        }
        /* พื้นที่แสดงหน้าจอวิดีโอ */
        .main-content {
            flex-grow: 1;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }
        .video-js {
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
        }
        .channel-title {
            margin-top: 0;
            font-size: 22px;
            color: #007aff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- แถบด้านข้างสำหรับโหลดและเลือกช่อง -->
        <div class="sidebar">
            <h3>รายการช่องทีวี</h3>
            <div class="upload-section">
                <label><strong>ใส่ไฟล์เพลย์ลิสต์ (.m3u):</strong></label>
                <input type="file" id="m3u-file" accept=".m3u,.m3u8">
            </div>
            <div class="channel-list" id="channel-container">
                <p style="color: #888; text-align: center; padding-top: 20px;">กรุณาเลือกไฟล์ .m3u เพื่อเริ่มใช้งาน</p>
            </div>
        </div>

        <!-- หน้าจอหลักสำหรับฉายวิดีโอ -->
        <div class="main-content">
            <h2 id="current-channel">โปรดเลือกช่องจากรายการด้านข้าง</h2>
            <video id="my-tv-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
                <p class="vjs-no-js">กรุณาเปิดใช้งาน JavaScript</p>
            </video>
        </div>
    </div>

    <script>
        // เรียกใช้งานตัวเล่นวิดีโอ Video.js
        var player = videojs('my-tv-player');

        // ตั้งค่าตัวดักจับการอัปโหลดไฟล์ .m3u จากผู้ใช้
        document.getElementById('m3u-file').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                var content = e.target.result;
                parseM3U(content); // ส่งข้อความในไฟล์ไปแยกแยะช่อง
            };
            reader.readAsText(file);
        });

        // ฟังก์ชันสำหรับแกะข้อมูลไฟล์ M3U ออกมาเป็นช่องๆ
        function parseM3U(m3uText) {
            var lines = m3uText.split('\n');
            var channels = [];
            var currentChannelInfo = null;

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    // แกะชื่อช่อง และ โลโก้ช่อง ออกมาจากบรรทัดคำสั่ง
                    var nameMatch = line.match(/,(.+)$/);
                    var logoMatch = line.match(/tvg-logo="([^"]+)"/);

                    currentChannelInfo = {
                        name: nameMatch ? nameMatch[1].trim() : "ช่องทีวีไม่มีชื่อ",
                        logo: logoMatch ? logoMatch[1] : "https://placeholder.com",
                        url: ""
                    };
                } else if (line && !line.startsWith('#') && currentChannelInfo) {
                    // หากเจอลิงก์สตรีมในบรรทัดถัดไป ให้ผูกเข้ากับชื่อช่องที่เจอเมื่อครู่
                    currentChannelInfo.url = line;
                    channels.push(currentChannelInfo);
                    currentChannelInfo = null; // รีเซ็ตเพื่อหาช่องถัดไป
                }
            }

            renderChannels(channels); // นำรายชื่อไปแสดงบนหน้าเว็บ
        }

        // ฟังก์ชันสร้างปุ่มกดช่องทีวีบนหน้าจอ
        function renderChannels(channels) {
            var container = document.getElementById('channel-container');
            container.innerHTML = ""; // ล้างค่าเก่าออกก่อน

            if (channels.length === 0) {
                container.innerHTML = "<p style='color:red; text-align:center;'>ไม่พบข้อมูลช่องในไฟล์นี้</p>";
                return;
            }

            channels.forEach(function(channel) {
                var button = document.createElement('button');
                button.className = "channel-item";
                button.innerHTML = `<img src="${channel.logo}" onerror="this.src='https://placeholder.com'"> <span>${channel.name}</span>`;
                
                // เมื่อคลิกช่อง ให้สั่งทำงานฟังก์ชันเล่นวิดีโอ
                button.onclick = function() {
                    playChannel(channel.name, channel.url);
                };

                container.appendChild(button);
            });
        }

        // ฟังก์ชันสั่งเล่นวิดีโอผ่าน Proxy หลังบ้าน
        function playChannel(name, streamUrl) {
            document.getElementById('current-channel').innerText = "กำลังรับชม: " + name;

            var proxyServerUrl = "http://localhost:3000/proxy-m3u8"; 
            
            // ลิงก์ไปหาเซิร์ฟเวอร์ Proxy เพื่อหลบการบล็อก (เหมือนระบบเดิม)
            var finalPlayUrl = proxyServerUrl + 
                               "?url=" + encodeURIComponent(streamUrl) + 
                               "&agent=" + encodeURIComponent("Mozilla/5.0 (iPhone; CPU iPhone OS 13_2_3 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/13.0.3 Mobile/15E148 Safari/604.1") + 
                               "&referrer=" + encodeURIComponent("https://ch3plus.com");

            player.src({
                src: finalPlayUrl,
                type: 'application/x-mpegURL'
            });

            player.play();
        }
    </script>
</body>
</html>
