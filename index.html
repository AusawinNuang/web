<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Ausawin Channel 2026</title>
    <style>
        body { font-family: sans-serif; display: flex; margin: 0; padding: 20px; background: #111; color: #fff; }
        .sidebar { width: 250px; margin-right: 20px; }
        .sidebar button { display: block; width: 100%; padding: 12px; margin-bottom: 8px; background: #333; color: #fff; border: none; cursor: pointer; text-align: left; font-size: 16px; border-radius: 4px; }
        .sidebar button:hover { background: #555; }
        .player-container { flex-grow: 1; }
        iframe { width: 100%; height: 500px; border: none; background: #000; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>เลือกช่องทีวี</h3>
        <!-- ปุ่มเปลี่ยนช่อง เรียกใช้ฟังก์ชัน changeChannel -->
        <button onclick="changeChannel('https://live-us1.thaimomo.com/live-as/chtnn24-2/playlist.m3u8')">TNN16</button>

    </div>

    <div class="player-container">
        <h2 id="channel-title">กำลังเล่น: เลือกช่อง</h2>
        <!-- หน้าจอแสดงผลวิดีโอ -->
        <iframe id="tv-player" src="" allowfullscreen></iframe>
    </div>

    <script>
        function changeChannel(url) {
            // สั่งเปลี่ยนลิงก์ src ของ iframe ตามปุ่มที่กด
            document.getElementById('tv-player').src = url;
        }
    </script>

</body>
</html>
