<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player</title>
    <!-- โหลด Video.js สำหรับเล่นไฟล์ .m3u8 -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; }
        .container { max-width: 800px; margin: 20px auto; }
        .btn-group { margin-bottom: 20px; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; background: #1e88e5; color: white; border: none; border-radius: 5px; }
        button:hover { background: #1565c0; }
        .video-container { width: 100%; aspect-ratio: 16/9; }
    </style>
</head>
<body>

<div class="container">
    <h2>เครื่องเล่น IPTV (MU TV & LFC TV)</h2>
    
    <!-- ปุ่มเลือกช่องที่จะเล่น -->
    <div class="btn-group">
        <button onclick="playChannel('https://cdn1.googlecdnforstreaming.live/live/mutv/playlist.m3u8', 'Mozilla/5.0 (Linux; Android 9; TrueID TV Build/PTT1.181126.002) AppleWebKit/537.36', 'https://warpdooball.net/')">
            เล่น MU TV
        </button>
        <button onclick="playChannel('https://raw.githubusercontent.com/ALittleAnt4161/m3u8/refs/heads/main/LFCTV3.m3u8', 'Mozilla/5.0 (iPhone; CPU iPhone OS 13_2_3 like Mac OS X) AppleWebKit/605.1.15', 'https://github.com/')">
            เล่น LFC TV (Link 1)
        </button>
        <button onclick="playChannel('https://cdn1.googlecdnforstreaming.live/live/lfctv/playlist.m3u8', 'Mozilla/5.0 (Linux; Android 7.1.2; TV BOX Build/NHG47L) AppleWebKit/537.36', 'https://warpdooball.net/')">
            เล่น LFC TV (Link 2)
        </button>
    </div>

    <!-- หน้าต่างเครื่องเล่นวิดีโอ -->
    <div class="video-container">
        <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" width="800" height="450">
            <p class="vjs-no-js">โปรดเปิดใช้งาน JavaScript เพื่อรับชมวิดีโอ</p>
        </video>
    </div>
</div>

<script src="https://zencdn.net"></script>
<script>
    // ตั้งค่าตัวเล่นวิดีโอครั้งแรก
    const player = videojs('my-video');

    function playChannel(url, ua, ref) {
        // แปลงลิงก์ให้วิ่งผ่านเซิร์ฟเวอร์ Proxy ของเรา พร้อมแนบค่าพารามิเตอร์ต่างๆ ไปด้วย
        const proxyServer = 'http://localhost:3000/proxy';
        const finalUrl = `${proxyServer}?url=${encodeURIComponent(url)}&ua=${encodeURIComponent(ua)}&ref=${encodeURIComponent(ref)}`;
        
        // สั่งให้เครื่องเล่นโหลดและแสดงผลวิดีโอชิ้นใหม่
        player.src({
            src: finalUrl,
            type: 'application/x-mpegURL' // กำหนดประเภทให้เป็นสตรีมมิง HLS
        });
        
        player.play().catch(err => {
            console.log("กรุณากดเล่นวิดีโอด้วยตนเอง:", err);
        });
    }
</script>
</body>
</html>
